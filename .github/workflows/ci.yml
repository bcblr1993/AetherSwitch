name: CI Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test (macOS Apple Silicon)
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Run Unit Tests
        run: swift test -v

      - name: Build Release Binary
        run: swift build -c release --arch arm64
